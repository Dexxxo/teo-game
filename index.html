<style>
@font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/nunito-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:'Lobster';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lobster-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:'Lobster';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lobster-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}/*
VOICE: тёплый, нежный, игривый — подарок от любимого человека
IDEA: уютная деревянная таверна-гостиная, где поле — резной игровой стол
PICTURE: живая комната с камином, лампой, Тео на лежанке и Марсой на ковре
COLOUR and TYPE: тёплое дерево и золото, пергамент; Lobster для заголовков, Nunito для текста
LAYOUT: телефон в портрете, HUD сверху, поле в центре, бустеры и комната снизу
*/
:root{color-scheme:light;--ink:#3b2416;--wood:#7a4a22;--gold:#E9B949}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{height:100%;overflow:hidden;background:#140c07;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit;font-size:16px}
#app{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);overflow:hidden;background:#2a1a10}
@media(min-width:481px){#app{box-shadow:0 0 80px #000}}
#cv,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
#fx{pointer-events:none;z-index:40}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#scr{position:absolute;inset:0;pointer-events:none}
#scr .layer{position:absolute;inset:0;pointer-events:none}
#scr .layer>*{pointer-events:auto}
#mods{position:absolute;inset:0;pointer-events:none;z-index:30}
#mods>*{pointer-events:auto}
.lob{font-family:'Lobster',Georgia,serif;font-weight:400}
.center{text-align:center}
.soft{color:#7a5a3c}.small{font-size:13px}
.sp{flex:1}
.hide{display:none!important}
/* buttons */
.btn{font:900 17px 'Nunito',sans-serif;color:#4a2a0c;border:0;border-radius:14px;padding:11px 20px;min-height:44px;background:linear-gradient(#ffe48f,#f2b33d);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.12),0 5px 0 #9a5d12,0 8px 14px rgba(0,0,0,.3);cursor:pointer;transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(255,255,255,.6);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;line-height:1.15}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 1px 0 #9a5d12,0 3px 6px rgba(0,0,0,.3)}
.btn:focus-visible,.ico:focus-visible,.navb:focus-visible,.boost:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.green{background:linear-gradient(#a6ea83,#4fae3b);color:#fff;text-shadow:0 2px 0 #2f6e22;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.12),0 5px 0 #2f6e22,0 8px 14px rgba(0,0,0,.3)}
.btn.pink{background:linear-gradient(#ffbcd8,#ee67a4);color:#fff;text-shadow:0 2px 0 #a8336a;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.12),0 5px 0 #a8336a,0 8px 14px rgba(0,0,0,.3)}
.btn.blue{background:linear-gradient(#a9dcff,#4f9ee6);color:#fff;text-shadow:0 2px 0 #2c62a0;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #2c62a0,0 8px 14px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(40,20,8,.55);color:#fff;text-shadow:none;box-shadow:none;border:2px solid rgba(255,230,180,.5)}
.btn.ghost2{background:#f3e2c0;color:#7a5a3c;text-shadow:none;box-shadow:0 3px 0 #c9a46e}
.panel .btn.ghost{background:#e9d3a8;color:#6b4a2f;border:0;box-shadow:0 4px 0 #b98a52}
.btn.small{font-size:14px;padding:7px 12px;min-height:38px;border-radius:11px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #9a5d12}
.btn.small.green{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #2f6e22}.btn.small.pink{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #a8336a}.btn.small.blue{box-shadow:0 4px 0 #2c62a0}
.btn[disabled]{filter:grayscale(.85) brightness(.92);opacity:.6;cursor:default}
.btn small{font-size:12px;font-weight:800;opacity:.9}
.ico{width:44px;height:44px;border-radius:14px;border:3px solid var(--wood);background:linear-gradient(#fff4dc,#efd29c);font-size:19px;box-shadow:0 3px 0 #5b3519,0 5px 10px rgba(0,0,0,.35);flex:none;cursor:pointer}
.x{width:38px;height:38px;border-radius:50%;border:2px solid var(--wood);background:#fff4dc;font-size:16px;font-weight:900;color:var(--wood);cursor:pointer;flex:none}
/* menu */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;flex-wrap:wrap}
.chip{background:rgba(40,20,8,.78);color:#fff;border:2px solid #c98a1b;border-radius:20px;padding:4px 11px 4px 9px;font-weight:900;font-size:14px;display:flex;gap:5px;align-items:center;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#scr .title{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;text-align:center;pointer-events:none}
#scr .title h1{pointer-events:auto;display:inline-block;font-family:'Lobster',Georgia,serif;font-weight:400;font-size:clamp(46px,14vw,64px);line-height:1;color:#FFE7A3;-webkit-text-stroke:1.5px #5b3519;text-shadow:0 3px 0 #b8741c,0 6px 0 #5b3519,0 10px 20px rgba(0,0,0,.6)}
#scr .title p{color:#fff;font-weight:800;font-size:16px;margin-top:8px;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.mcenter{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 206px);display:flex;flex-direction:column;align-items:center;gap:12px}
.btn.big{font-size:30px;padding:14px 54px;border-radius:22px;font-family:'Lobster',Georgia,serif;font-weight:400;letter-spacing:.5px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}
.best{white-space:nowrap;color:#FFE7A3;font-weight:900;font-size:14px;text-shadow:0 2px 4px rgba(0,0,0,.9);background:rgba(40,20,8,.5);padding:3px 12px;border-radius:12px}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:22px 6px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,rgba(20,10,4,.78) 45%);pointer-events:none}
.navb{pointer-events:auto;background:none;border:0;color:#fff;font:900 12px 'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-width:64px;cursor:pointer;text-shadow:0 1px 3px #000}
.ni{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:27px;background:linear-gradient(#fff4dc,#efd29c);border:3px solid var(--wood);box-shadow:0 4px 0 #5b3519,0 6px 12px rgba(0,0,0,.4)}
.navb:active .ni{transform:translateY(3px);box-shadow:0 1px 0 #5b3519}
.dot{position:absolute;top:-4px;right:4px;background:#e0444c;color:#fff;font-style:normal;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 5px}
/* hud */
.hud{position:absolute;top:0;left:0;right:0;display:flex;gap:7px;align-items:stretch;padding:calc(env(safe-area-inset-top) + 8px) 8px 0}
.hud .ico{align-self:flex-start}
.hudbox{background:linear-gradient(#6b4022,#3f230f);border:3px solid var(--gold);border-radius:18px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.goalsBox{flex:1;padding:4px 6px 6px}
.lvl{font:800 12px 'Nunito',sans-serif;color:#FFE7A3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.goals{display:flex;justify-content:center;gap:10px;margin-top:3px;flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:4px;font:900 19px 'Nunito',sans-serif}
.goal img{width:36px;height:36px;border-radius:9px;display:block}
.goal.done b{color:#8BE36B}
.goal.bump img{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.3)}}
.movesBox{width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.movesBox b{font:900 30px 'Nunito',sans-serif;line-height:1}
.movesBox small{font-size:11px;font-weight:800;color:#FFE7A3}
.movesBox.low b{color:#FF8A80;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.boosters{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:none}
.boost{pointer-events:auto;width:62px;height:62px;border-radius:18px;border:3px solid var(--wood);background:linear-gradient(#fff4dc,#efd29c);font-size:28px;position:relative;box-shadow:0 4px 0 #5b3519,0 6px 12px rgba(0,0,0,.4);cursor:pointer}
.boost:active{transform:translateY(3px)}
.boost .bp{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);font:900 11px 'Nunito',sans-serif;font-style:normal;background:#3f230f;color:#FFD977;border-radius:8px;padding:1px 6px;white-space:nowrap;border:1.5px solid var(--gold)}
.boost.on{border-color:#fff;box-shadow:0 0 0 4px #FFD24A,0 0 24px #FFD24A;animation:pulse .9s infinite}
/* modal */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,8,3,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.panel{background:linear-gradient(#fff6e2,#f1d9a8);border-radius:22px;border:4px solid var(--wood);box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 30px rgba(160,100,40,.22),0 14px 40px rgba(0,0,0,.55);padding:20px 18px}
.modal>.panel{width:100%;max-width:380px;max-height:calc(100% - 10px);overflow:auto;animation:popIn .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.panel h2{font-size:32px;line-height:1.05;margin:2px 0 8px;color:#5b3519;text-wrap:balance}
.panel p{margin:6px 0;line-height:1.4}
.mbtns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.bigdog{width:96px;height:96px;margin:4px auto;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:wobble 2s ease-in-out infinite}
@keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.ribbon{display:inline-block;font-size:30px;color:#fff;background:linear-gradient(#ff8a7a,#d9434e);padding:6px 22px;border-radius:12px;box-shadow:0 4px 0 #8f2430;text-shadow:0 2px 0 #8f2430;margin-bottom:6px}
.reward{font:900 40px 'Nunito',sans-serif;color:#5b3519;margin:6px 0}
.reward span{font-size:32px}
.bosstag{display:inline-block;background:#3f230f;color:#FFD977;font-weight:900;font-size:13px;padding:3px 12px;border-radius:10px;border:2px solid var(--gold)}
.igoals{display:flex;justify-content:center;gap:14px;margin:8px 0;flex-wrap:wrap}
.ig{display:flex;flex-direction:column;align-items:center;font:900 20px 'Nunito',sans-serif}
.ig img{width:54px;height:54px}
.mut{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(122,74,34,.12);border-radius:12px;padding:8px 10px;margin-top:8px}
.mut span{font-size:26px}.mut small{display:block;color:#7a5a3c}
.bic{font-size:52px}
.rules{text-align:left;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:15px;line-height:1.35}
.note{background:#fffdf5;border-radius:6px;padding:16px 18px 12px;margin:10px 4px;box-shadow:0 6px 14px rgba(0,0,0,.18);transform:rotate(-1.5deg);border-top:22px solid #ffd6e4;text-align:left}
.note p{font-family:'Lobster',Georgia,serif;font-size:22px;color:#5b3519;line-height:1.25}
.note span{display:block;text-align:right;color:#a0607a;font-weight:800;margin-top:6px}
.perks{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.perk{display:grid;grid-template-columns:48px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;align-items:center;background:linear-gradient(#fffaf0,#f6e3bd);border:3px solid #c9995b;border-radius:16px;padding:10px 12px;cursor:pointer;position:relative;box-shadow:0 4px 0 #b98a52;font-family:inherit;color:var(--ink)}
.perk:active{transform:translateY(3px);box-shadow:0 1px 0 #b98a52}
.perk .pi{grid-row:1/3;font-size:34px;text-align:center}
.perk b{font-size:17px}.perk small{color:#7a5a3c;font-size:13px}
.perk i{position:absolute;top:6px;right:10px;font-style:normal;font-weight:900;color:#c2304a}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:rgba(40,20,8,.92);color:#fff;font-weight:800;padding:10px 18px;border-radius:16px;border:2px solid var(--gold);z-index:60;pointer-events:none;white-space:normal;text-align:center;width:max-content;max-width:88%;animation:toastIn .3s cubic-bezier(.2,1.4,.4,1)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes toastIn{from{transform:translate(-50%,-20px);opacity:0}}
/* pages */
.modal.page{padding:0;align-items:stretch;background:rgba(15,8,3,.4)}
.pg{width:100%;height:100%;border-radius:0;display:flex;flex-direction:column;padding:0;border:0;animation:slideUp .35s cubic-bezier(.2,1.1,.4,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}}
.pgh{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;border-bottom:3px solid #d8b98a;background:linear-gradient(#ffe9b8,#f5d79a)}
.pgh b{font-size:28px;color:#5b3519}
.pgb{flex:1;overflow:auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.pgb h3{font-size:18px;margin:20px 0 8px;color:#5b3519}
.empty{text-align:center;padding:30px 10px;color:#7a5a3c;font-weight:700}
.empty img{width:80px;opacity:.85;margin-bottom:8px}
/* coupons */
.ccard{--rc:#AFC2CC;width:200px;height:284px;border-radius:16px;position:relative;background:linear-gradient(160deg,#fffaf0,#f3dfb6);border:5px solid var(--rc);box-shadow:0 0 0 3px #3b2416,0 0 26px var(--rc),0 10px 20px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;padding:16px 12px;text-align:center;overflow:hidden;margin:0 auto}
.ccard::before{content:'';position:absolute;inset:6px;border:1.5px dashed rgba(122,74,34,.35);border-radius:10px;pointer-events:none}
.ccard .art{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--rc));display:flex;align-items:center;justify-content:center;font-size:58px;border:4px solid #3b2416;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);flex:none}
.ccard .gem{position:absolute;top:10px;right:10px;width:18px;height:18px;transform:rotate(45deg);background:var(--rc);border:2.5px solid #3b2416;box-shadow:inset 3px 3px 0 rgba(255,255,255,.5)}
.ccard .ct{font-family:'Lobster',Georgia,serif;font-size:22px;line-height:1.08;margin-top:10px;color:#3b2416;text-wrap:balance}
.ccard .cd{font-size:13px;margin-top:6px;color:#6b4a2f;line-height:1.25}
.ccard .cr{position:absolute;bottom:9px;left:0;right:0;font-size:11px;font-weight:900;color:#fff;background:var(--rc);margin:0 30px;border-radius:8px;padding:1px 0;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.ccard.mini{width:146px;height:208px;padding:11px 8px;border-width:4px;box-shadow:0 0 0 2.5px #3b2416,0 0 14px var(--rc),0 6px 12px rgba(0,0,0,.3)}
.ccard.mini .art{width:74px;height:74px;font-size:38px;border-width:3px}
.ccard.mini .ct{font-size:16px;margin-top:7px}.ccard.mini .cd{font-size:11px}
.ccard.used{filter:grayscale(1) sepia(.25) brightness(.95)}
.cbig .ccard{transform:scale(1.08);margin:14px auto 18px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 10px;justify-items:center;margin-top:10px}
.citem{display:flex;flex-direction:column;align-items:center;gap:4px}
.cwrap{position:relative;cursor:pointer}
.cwrap:active{transform:scale(.97)}
.stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-16deg);border:3px solid #c0392b;color:#c0392b;font-weight:900;padding:3px 8px;border-radius:8px;font-size:14px;background:rgba(255,255,255,.75);text-align:center;line-height:1.1;white-space:nowrap}
.stamp small{display:block;font-size:10px}

/* pack */

.env{width:230px;height:156px;position:relative;cursor:pointer;animation:bob 1.6s ease-in-out infinite;perspective:600px}
@keyframes bob{50%{transform:translateY(-8px) rotate(1deg)}}
.env .ebody{position:absolute;inset:0;background:linear-gradient(#f9e6bf,#e2bd7c);border:4px solid var(--wood);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.env .ebody::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(160deg,transparent 49%,rgba(122,74,34,.25) 50%,transparent 52%),linear-gradient(200deg,transparent 49%,rgba(122,74,34,.25) 50%,transparent 52%)}
.env .eflap{position:absolute;left:4px;right:4px;top:4px;height:92px;background:linear-gradient(#f3d6a0,#d6aa62);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s;z-index:1}
.env .seal{position:absolute;left:50%;top:70px;width:48px;height:48px;margin-left:-24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8fa2,#c2304a);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 #7a1d2e,0 6px 10px rgba(0,0,0,.3);z-index:2;transition:transform .4s,opacity .4s}
.env.open .eflap{transform:rotateX(180deg)}
.env.open .seal{transform:scale(0);opacity:0}
.env.gone{animation:none;transform:scale(.3) translateY(80px);opacity:0;transition:all .4s;height:0;margin:-14px 0}
.flip{width:200px;height:284px;perspective:1000px;cursor:pointer;animation:rise .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(120px) scale(.4);opacity:0}}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.3,.5,1)}
.flip.open .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .cb{width:100%;height:100%;border-radius:16px;background:radial-gradient(circle at 50% 40%,#9a5fe0,#3a1d63);border:5px solid #f6c453;box-shadow:0 0 0 3px #3b2416,0 10px 20px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#FFE7A3}
.flip .cb span{font-size:70px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.flip .cb b{font-size:24px}
.flip:not(.open).r-r .cb{box-shadow:0 0 0 3px #3b2416,0 0 30px #4AA3FF}
.flip:not(.open).r-e .cb{animation:glowE 1s ease-in-out infinite}
.flip:not(.open).r-l .cb{animation:glowL .7s ease-in-out infinite}
@keyframes glowE{50%{box-shadow:0 0 0 3px #3b2416,0 0 50px 10px #B45CFF}}
@keyframes glowL{0%,100%{box-shadow:0 0 0 3px #3b2416,0 0 40px 8px #FF9A1F}50%{box-shadow:0 0 0 3px #3b2416,0 0 80px 26px #FFB347;transform:scale(1.03)}}
.pbtns{min-height:50px}
.modal.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}

/* ===== backup mirror: IndexedDB copy of every teo* key ===== */
function idbOpen(){return new Promise((ok,no)=>{try{const r=indexedDB.open('teo_backup',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function lsSnapshot(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('teo'))o[k]=localStorage.getItem(k)}}catch(e){}return o}
async function idbBackup(){try{const snap=lsSnapshot();if(!snap[KEY])return;const db=await idbOpen();await new Promise(ok=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put({t:Date.now(),snap},'last');tx.oncomplete=ok;tx.onerror=ok;tx.onabort=ok});db.close()}catch(e){}}
async function idbRestore(){try{if(localStorage.getItem(KEY))return false;const db=await Promise.race([idbOpen(),sleep(1500).then(()=>null)]);if(!db)return false;const v=await new Promise(ok=>{const r=db.transaction('kv').objectStore('kv').get('last');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)});db.close();if(!v||!v.snap||!v.snap[KEY])return false;for(const k in v.snap)localStorage.setItem(k,v.snap[k]);return true}catch(e){return false}}
function backupInit(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}setInterval(idbBackup,60000);document.addEventListener('visibilitychange',()=>{if(document.hidden)idbBackup()});setTimeout(idbBackup,5000)}

const PHKEY='teo3_photos';let PH={};const PHIMG={};
function loadPhotos(){try{PH=JSON.parse(localStorage.getItem(PHKEY)||'{}')||{}}catch(e){PH={}}for(const k in PH)photoImg(k)}
function photoImg(pid){if(!pid||!PH[pid])return null;if(PHIMG[pid])return PHIMG[pid].complete?PHIMG[pid]:null;const im=new Image();im.onload=()=>{APP.roomDirty=true};im.src=PH[pid];PHIMG[pid]=im;return null}
function savePhotos(){try{localStorage.setItem(PHKEY,JSON.stringify(PH));return true}catch(e){return false}}
function pickPhoto(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';document.body.appendChild(inp);
 inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;const url=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{const M=420,k=Math.min(1,M/Math.max(im.width,im.height));const cv=mkCanvas(Math.round(im.width*k),Math.round(im.height*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
   const pid='ph'+Date.now().toString(36);PH[pid]=cv.toDataURL('image/jpeg',.8);if(!savePhotos()){delete PH[pid];toast('Не хватает места для фото 😢');return}photoImg(pid);cb(pid)};
  im.onerror=()=>{toast('Не получилось открыть фото');URL.revokeObjectURL(url)};im.src=url});
 inp.click()}
function gcPhotos(){const used=new Set();for(const r in S.deco){const d=S.deco[r];if(!d)continue;if(d.mantel&&d.mantel.ph)used.add(d.mantel.ph);const ex=d.extra;if(ex)ex.forEach(e=>e.ph&&used.add(e.ph))}let ch=false;for(const k in PH)if(!used.has(k)){delete PH[k];delete PHIMG[k];ch=true}if(ch)savePhotos()}

const VURL={};let VDB=null;
function vdb(){return new Promise((res,rej)=>{if(VDB)return res(VDB);try{const rq=indexedDB.open('teo3',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('audio');rq.onsuccess=()=>{VDB=rq.result;res(VDB)};rq.onerror=()=>rej(rq.error)}catch(e){rej(e)}})}
function vtx(mode,fn){return vdb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('audio',mode);const st=tx.objectStore('audio');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}))}
async function loadVoices(){S.voices=S.voices||[];for(const v of S.voices){try{const b=await vtx('readonly',st=>st.get(v.id));if(b)VURL[v.id]=URL.createObjectURL(b)}catch(e){}}}
const VCAT={any:'Любое',morning:'Утро',note:'После забега',legend:'Легендарный купон',bday:'День рождения',anniv:'Годовщины'};
function voicesOf(cat){const vs=(S.voices||[]).filter(v=>VURL[v.id]);let c=vs.filter(v=>v.cat===cat);if(!c.length)c=vs.filter(v=>v.cat==='any');return c}
function voiceBtn(cat){return voicesOf(cat).length?`<button class="btn small blue vbtn" data-voice="${cat}">▶ Послушать ${esc(S.him)}</button>`:''}
let CURA=null;function playVoice(cat,id){const vs=id?[{id}]:voicesOf(cat);if(!vs.length)return;const v=pick(vs);try{if(CURA)CURA.pause();CURA=new Audio(VURL[v.id]);CURA.volume=1;const p=CURA.play();if(p&&p.catch)p.catch(()=>toast('Не получилось включить звук'))}catch(e){}}
function uploadVoice(cat){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.style.display='none';document.body.appendChild(inp);
 inp.addEventListener('change',async()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;if(f.size>6*1024*1024){toast('Файл больше 6 МБ — запиши покороче');return}const id='v'+Date.now().toString(36);try{await vtx('readwrite',st=>st.put(f,id));VURL[id]=URL.createObjectURL(f);S.voices=S.voices||[];S.voices.push({id,cat,n:(f.name||'голосовое').slice(0,40)});save();toast('Голосовое сохранено 🎙');reDima()}catch(e){toast('Не получилось сохранить файл')}});inp.click()}

function updWalkers(dt,L,deco){if(!L)return;for(const w of WK.list){if(w.jump>0)continue;

 if(w.mode==='walk'){const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy);const sp=(w.pose==='sniff'?.03:w.fast?.13:.075)*dt;if(d<2){w.x=w.tx;w.y=w.ty;w.mode='stay';w.pose='sit';const r=w._res;w._res=null;r&&r()}else{const m=Math.min(d,sp);w.x+=dx/d*m;w.y+=dy/d*m;if(Math.abs(dx)>.5)w.face=dx>0?1:-1;w.ph+=dt*(w.fast?.03:.018)}continue}
 if(w.mode==='zoom'){w.zt-=dt;w.za+=dt*.006;const nx=w.zc.x+Math.cos(w.za)*62,ny=w.zc.y+Math.sin(w.za)*24;w.face=nx>w.x?1:-1;w.x=nx;w.y=ny;w.ph+=dt*.04;w.pose='walk';if(w.zt<=0){w.mode='stay';w.pose='sit';const r=w._res;w._res=null;r&&r()}continue}
 if(w.mode==='carried'){const p=PPL.her&&PPL.her.carry===w?PPL.her:PPL.him&&PPL.him.carry===w?PPL.him:null;if(p){w.x=p.x+6*(p.face||1);w.y=p.y+1;w.z=58;w.face=p.face||1;w.pose='sit'}continue}}}

function drawFloorArch(c,L,room,key){const W=400,fl=L.fl,VH=L.VH,R=srand(23);c.save();c.beginPath();c.rect(0,fl,W,VH-fl);c.clip();const bg=b=>{c.fillStyle=lingrad(c,fl,VH,shade(b,-.2),shade(b,.06));c.fillRect(0,fl,W,VH-fl)};
 switch(key){
 case'carpet':bg('#B9A2D6');for(let k=0;k<1400;k++){c.fillStyle=R()<.5?'rgba(255,255,255,.08)':'rgba(60,30,90,.1)';c.fillRect(R()*W,fl+R()*(VH-fl),1.4,1.4)}break;
 case'bathtile':{bg('#FFFFFF');const r=11,hx=r*Math.sqrt(3);for(let row=0,y=fl;y<VH+r;row++,y+=r*1.5)for(let x=(row%2)*hx/2;x<W+hx;x+=hx){c.beginPath();for(let k=0;k<6;k++){const a=Math.PI/6+k*Math.PI/3;c.lineTo(x+Math.cos(a)*(r-1),y+Math.sin(a)*(r-1))}c.closePath();c.fillStyle=R()<.12?'#8FD3E8':'#F2F8FA';c.fill();c.strokeStyle='rgba(120,160,180,.4)';c.lineWidth=1;c.stroke()}break}
 case'slate':{bg('#6E7A86');for(const[y,h,i]of fRows(fl,VH,34,5)){const w=h*1.6;for(let x=-(i%2)*w/2;x<W;x+=w){c.fillStyle=shade(pick(['#7E8A96','#6A7682','#8A949E']),(R()-.5)*.1);c.fillRect(x+2,y+2,w-4,h-4);c.fillStyle='rgba(255,255,255,.06)';c.fillRect(x+4,y+4,w*.4,2)}}break}
 case'deck':{bg('#E6DCC8');for(const[y,h,i]of fRows(fl,VH,16,1.6)){c.fillStyle=R()<.5?'rgba(255,255,255,.18)':'rgba(120,100,70,.08)';c.fillRect(0,y,W,h);c.fillStyle='rgba(90,70,40,.35)';c.fillRect(0,y,W,1.4);for(let x=(i*37)%90;x<W;x+=90+R()*40){c.fillStyle='rgba(90,70,40,.3)';c.fillRect(x,y,1.4,h)}}break}
 case'deckdark':{bg('#4A3A5A');for(const[y,h,i]of fRows(fl,VH,18,2)){c.fillStyle=R()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)';c.fillRect(0,y,W,h);c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,y,W,1.5)}c.save();c.globalCompositeOperation='lighter';for(let k=0;k<20;k++){const x=R()*W,y=fl+20+R()*(VH-fl-20);const g=c.createRadialGradient(x,y,0,x,y,10);g.addColorStop(0,'rgba(255,220,150,.35)');g.addColorStop(1,'rgba(255,220,150,0)');c.fillStyle=g;c.fillRect(x-10,y-10,20,20)}c.restore();break}
 case'tatami':{bg('#C9C08A');for(const[y,h,i]of fRows(fl,VH,52,8)){const w=h*2;for(let x=-(i%2)*w/2,j=0;x<W;x+=w,j++){const hor=(i+j)%2===0;const ww=hor?w:w/2;for(let s=0;s<(hor?1:2);s++){const xx=x+s*ww;c.fillStyle=shade('#CFC690',(R()-.5)*.06);c.fillRect(xx+1,y+1,ww-2,h-2);c.strokeStyle='rgba(110,100,50,.25)';c.lineWidth=1;for(let q=hor?y+4:xx+4;q<(hor?y+h:xx+ww);q+=3.4){c.beginPath();if(hor){c.moveTo(xx,q);c.lineTo(xx+ww,q)}else{c.moveTo(q,y);c.lineTo(q,y+h)}c.stroke()}c.strokeStyle='#3E5A3A';c.lineWidth=3;c.strokeRect(xx+1.5,y+1.5,ww-3,h-3)}}}break}
 case'metal':{bg('#5A6280');for(const[y,h,i]of fRows(fl,VH,40,6)){for(let x=0;x<W;x+=h*1.4){rr(c,x+2,y+2,h*1.4-4,h-4,4);c.fillStyle='rgba(255,255,255,.04)';c.fill();c.strokeStyle='rgba(10,12,25,.55)';c.lineWidth=2;c.stroke();c.strokeStyle='rgba(20,24,40,.5)';c.lineWidth=1;for(let q=x+8;q<x+h*1.4-6;q+=6){c.beginPath();c.moveTo(q,y+6);c.lineTo(q,y+h-6);c.stroke()}}}c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(80,220,255,.25)';c.fillRect(0,fl+2,W,2);c.restore();break}
 case'parquetdark':drawFloorStyle(c,L,room,'scandi',{c:7});break;
 case'checker':{bg('#F4EFE6');for(const[y,h,i]of fRows(fl,VH,24,3)){const s=h*1.15;for(let x=-(i%2)*s,j=0;x<W;x+=s*2,j++){c.fillStyle='#2B2526';c.fillRect(x,y,s,h)}}break}
 default:c.restore();return drawFloorStyle(c,L,room,key,null)}
 const sg=c.createLinearGradient(0,fl,0,fl+44);sg.addColorStop(0,'rgba(0,0,0,.35)');sg.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=sg;c.fillRect(0,fl,W,44);c.restore()}

function roomNo(rid){return(ROOM[rid]&&ROOM[rid].no)||[]}
function addSigs(rid){const r=ROOM[rid],d=S.deco[rid];if(!r||!d)return;S.sigs=S.sigs||{};if(S.sigs[rid])return;S.sigs[rid]=1;for(const k of roomNo(rid))d[k]=null;d.extra=d.extra||[];
 for(const[id,x,fy]of(r.sig||[]))if(!d.extra.some(e=>e.id===id))d.extra.push({u:'s_'+id,id,x,fy,c:EXI[id].col})}
function xpos(e,L){if(e.sp){const q=spPoint(e,L);if(q)return q}const d=EXI[e.id];const[x0,x1,y0,y1]=exLimits(d,L);return{x:clamp(e.x,x0,x1),y:L.fl+clamp(e.fy,y0,y1)}}
function v2s(x,y){const v=APP.view,sc=APP.W/400;return{x:x*sc*v.s+v.x,y:y*sc*v.s+v.y}}
function seatHomes(L,deco){for(const e of(deco.extra||[])){const d=EXI[e.id];if(!d||!d.pseat)continue;const p=xpos(e,L);const[a,b]=d.pseat;return{her:{x:p.x+a[0],y:p.y+3+(a[3]||0),sit:a[1],sofa:d.cuddle?1:0},him:{x:p.x+b[0],y:p.y+3+(b[3]||0),sit:b[1],sofa:d.cuddle?1:0}}}return null}

 <li>❄️ Лёд трескается от совпадения с замороженной собачкой или рядом с ней. 🧶 Клубки рвутся от совпадений рядом.</li>

 <li>⭐ За каждый уровень — звезда. Звёзды тратятся на <b>задания</b> в комнатах (кнопка 📋 под «Играть»), и после каждого — сценка с ${esc(S.her)} и ${esc(S.him)}.</li>

 <li>🎴 Купон-сюрприз Тео приносит только за победу над боссом (10-й уровень каждого сезона), а на косточки можно обустраивать дом 🛋️.</li>

function drawCoupon(){S.sinceLeg++;const w={c:60,r:27,e:10,l:3};const luck=(S.run&&S.run.perks.luck)||0;w.c=Math.max(10,w.c-12*luck);w.e+=5*luck;w.l+=2*luck;let r='c';
 if(S.sinceLeg>=20&&S.pool.some(p=>p.r==='l'))r='l';else{let tot=0;for(const k in w)tot+=w[k];let x=Math.random()*tot;for(const k of['c','r','e','l']){x-=w[k];if(x<0){r=k;break}}}
 const order=['l','e','r','c'];let i=order.indexOf(r),cand=S.pool.filter(p=>p.r===r);while(!cand.length&&i<3){i++;cand=S.pool.filter(p=>p.r===order[i])}if(!cand.length)cand=S.pool;const tp=pick(cand);if(tp.r==='l')S.sinceLeg=0;
